spring.application.name=traceback-backend

# ── SERVER ──────────────────────────────────────────────
server.port=${PORT:8080}

# ── MYSQL ───────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tracebackdb}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── FLYWAY ──────────────────────────────────────────────
# Owns schema creation/migration. Versioned SQL scripts live in
# src/main/resources/db/migration. Add new V{n}__description.sql files
# for future schema changes instead of relying on Hibernate auto-DDL.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ── JPA / HIBERNATE ─────────────────────────────────────
# 'validate' checks entities match the Flyway-managed schema at startup
# and fails fast on drift, instead of silently altering tables in prod.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ── JWT ─────────────────────────────────────────────────
# No default here on purpose — see JwtSecretEnvironmentPostProcessor, which
# fails startup loudly if JWT_SECRET is missing/too short instead of
# silently falling back to a known placeholder value.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# ── CORS ────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── RATE LIMITING (per client IP, per fixed window) ─────
app.rate-limit.window-ms=${RATE_LIMIT_WINDOW_MS:60000}
app.rate-limit.auth-limit=${RATE_LIMIT_AUTH:10}
app.rate-limit.case-limit=${RATE_LIMIT_CASE:5}

# ── JSON ────────────────────────────────────────────────
spring.jackson.default-property-inclusion=non_null

# ── UPLOAD SIZE (for multipart photo uploads) ──────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=15MB
spring.mvc.async.request-timeout=30000

# ── FILE STORAGE ────────────────────────────────────────
# Where uploaded case photos are saved on disk, and the URL path they're
# served from (see FileUploadConfig / UploadController). Point this at a
# persistent volume in production — the default is relative to wherever
# the jar is run from and will NOT survive a redeploy on most PaaS setups.
app.upload.dir=${UPLOAD_DIR:uploads}
app.upload.public-path=${UPLOAD_PUBLIC_PATH:/uploads}
